<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Codeply Design: one artist's brush, a plain white shape on Craft and Crew's blue -->
  <rect width="512" height="512" fill="#2F6BFF"/>
  <g transform="rotate(45 256 256) translate(256 256) scale(1.08) translate(-256 -244)" fill="#FFFFFF">
    <!-- handle, thin at the end and fuller toward the metal -->
    <path d="M244 56Q256 28 268 56L288 264H224Z"/>
    <!-- ferrule -->
    <rect x="221" y="274" width="70" height="48" rx="8"/>
    <!-- bristles, flaring out to a curled tip -->
    <path d="M222 332H290C302 368 298 408 274 438C259 456 236 466 211 461C229 449 235 430 230 412C219 388 215 358 222 332Z"/>
  </g>
</svg>
