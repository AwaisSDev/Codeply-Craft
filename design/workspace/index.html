<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codeply workspace</title>
<style>
  /* Tokens taken from the shipping app (styles.css), so this feels like Codeply, not a mock. */
  :root {
    --bg: #0f0f0f; --side: #171717; --rail: #121212; --panel: #1b1b1b; --card: #202020; --card-border: #2a2a2a;
    --hover: rgba(255, 255, 255, .055); --active: rgba(255, 255, 255, .09);
    --text: #ececec; --dim: #ababab; --faint: #8a8a8a; --border: #262626;
    --accent: #3d8bfd; --green: #4cc38a; --red: #ef6a5a; --warn: #f0883e; --purple: #9b7bff;
    --surface-2: #2b2b2b; --bubble: #2b2b2b; --pop: #272727; --control: #272727; --control-border: #363636;
    --shadow-md: 0 8px 24px rgba(0, 0, 0, .4), 0 1px 3px rgba(0, 0, 0, .3); --shadow-pop: 0 12px 32px rgba(0, 0, 0, .45);
    --font-ui: "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    --font-mono: ui-monospace, "Cascadia Code", "Cascadia Mono", "SF Mono", Consolas, monospace;
    --r-lg: 18px; --r-md: 12px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--font-ui); -webkit-font-smoothing: antialiased; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--active); border-radius: 6px; }

  /* Icons: the app's own pack. Each draws at its grid size (20 or 24) so every edge lands on a pixel. */
  .ico { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; shape-rendering: geometricPrecision; }
  svg.ico-fill { fill: currentColor; stroke: none; width: 20px; height: 20px; }
  .ico.s16 { width: 16px; height: 16px; } .ico.s12 { width: 12px; height: 12px; }

  /* ---------- frame ---------- */
  .app { height: 100vh; display: grid; grid-template-columns: 60px 268px 1fr; grid-template-rows: 44px 1fr; }
  .titlebar { grid-column: 1 / -1; display: flex; align-items: center; gap: 4px; padding-left: 14px; background: var(--rail); border-bottom: 1px solid var(--border); -webkit-app-region: drag; }
  .titlebar > * { -webkit-app-region: no-drag; }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 15px; width: 300px; }
  .cmdk { flex: 1; max-width: 560px; margin: 0 auto; height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 9px; background: var(--hover); border: 1px solid var(--border); color: var(--faint); font-size: 13px; cursor: text; }
  .cmdk kbd { margin-left: auto; font: inherit; font-size: 12px; color: var(--faint); border: 1px solid var(--border); border-radius: 5px; padding: 0 5px; }
  .tb-right { width: 300px; display: flex; justify-content: flex-end; align-items: center; }
  .win-btn { width: 46px; height: 44px; display: grid; place-items: center; color: var(--dim); }
  .win-btn:hover { background: var(--hover); } .win-btn.x:hover { background: #e81123; color: #fff; }
  .ibtn { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: var(--dim); flex: none; transition: background .15s ease-out, color .15s ease-out; }
  .ibtn:hover { background: var(--hover); color: var(--text); }

  /* activity rail */
  .rail { background: var(--rail); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 4px; }
  .rail .tab { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: var(--faint); position: relative; transition: background .15s ease-out, color .15s ease-out; }
  .rail .tab:hover { color: var(--text); background: var(--hover); }
  .rail .tab.on { color: var(--text); background: var(--active); }
  .rail .tab.on::before { content: ""; position: absolute; left: -8px; top: 12px; bottom: 12px; width: 3px; border-radius: 0 3px 3px 0; background: var(--text); }
  .rail .tab .n { position: absolute; top: 5px; right: 4px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--accent); color: #fff; font-size: 10.5px; font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
  .rail .grow { flex: 1; }
  .tipl { position: fixed; z-index: 50; pointer-events: none; padding: 5px 9px; border-radius: 8px; background: var(--pop); border: 1px solid var(--control-border); font-size: 12.5px; box-shadow: var(--shadow-pop); opacity: 0; transition: opacity .12s ease-out; }
  .tipl.show { opacity: 1; }

  /* contextual sidebar */
  .side { background: var(--side); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .side-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 12px 8px 16px; }
  .side-head h2 { margin: 0; font-size: 15px; font-weight: 650; }
  .side-scroll { overflow: auto; flex: 1; padding: 0 8px 10px; }
  .sec { display: flex; align-items: center; gap: 8px; padding: 14px 8px 6px; color: var(--faint); font-size: 12.5px; font-weight: 600; }
  .sec .grow { flex: 1; }
  .row { display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 6px 10px; border-radius: 10px; color: var(--text); cursor: pointer; transition: background .12s ease-out; }
  .row:hover { background: var(--hover); } .row.on { background: var(--active); }
  .row .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
  .row .nm small { display: block; color: var(--faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row time, .row .meta { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; flex: none; }
  .row .ico, .row svg.ico-fill { color: var(--dim); }
  .me { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--border); }
  .me .pic { width: 30px; height: 30px; border-radius: 50%; background: #2f8f5b; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; }
  .me .grow { flex: 1; font-size: 13.5px; } .me small { display: block; color: var(--faint); font-size: 12px; }

  /* main */
  .main { position: relative; min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  .view { flex: 1; min-height: 0; overflow: auto; position: relative; }
  .head { display: flex; align-items: center; gap: 12px; padding: 16px 24px 12px; }
  .head h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -.01em; }
  .head .sub { color: var(--faint); font-size: 13px; }
  .head .grow { flex: 1; }
  .btn { height: 32px; padding: 0 12px; border-radius: 9px; display: inline-flex; align-items: center; gap: 7px; background: var(--control); border: 1px solid var(--control-border); font-size: 13px; transition: background .15s ease-out; }
  .btn:hover { background: #303030; }
  .btn.primary { background: #ececec; color: #141414; border-color: transparent; font-weight: 600; }
  .btn.primary:hover { background: #fff; }
  .btn.blue { background: var(--accent); color: #fff; border-color: transparent; }
  .btn.green { background: #238636; color: #fff; border-color: transparent; font-weight: 600; }
  .seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--hover); border: 1px solid var(--border); }
  .seg button { height: 26px; padding: 0 12px; border-radius: 7px; color: var(--dim); font-size: 13px; }
  .seg button.on { background: var(--surface-2); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, .3); }
  .card { background: var(--card); border: 1px solid var(--card-border); border-radius: var(--r-md); }
  .pill { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .pill.green { color: var(--green); background: rgba(76, 195, 138, .12); } .pill.warn { color: var(--warn); background: rgba(240, 136, 62, .12); }
  .pill.blue { color: var(--accent); background: rgba(61, 139, 253, .12); } .pill.gray { color: var(--dim); background: var(--hover); }
  .pill.purple { color: var(--purple); background: rgba(155, 123, 255, .14); } .pill.red { color: var(--red); background: rgba(239, 106, 90, .12); }

  /* composer (the app's) */
  .composer { background: #1f1f1f; border: 1px solid #333; border-radius: var(--r-lg); box-shadow: var(--shadow-md); }
  .composer .proj { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-bottom: 1px solid #2c2c2c; font-size: 13px; font-weight: 600; }
  .composer textarea { width: 100%; border: 0; outline: 0; resize: none; background: none; color: var(--text); font: inherit; font-size: 15px; padding: 14px 16px 4px; height: 50px; }
  .composer textarea::placeholder { color: var(--faint); }
  .composer .bar { display: flex; align-items: center; gap: 6px; padding: 6px 10px 10px; }
  .composer .bar .grow { flex: 1; }
  .cchip { height: 30px; padding: 0 10px; border-radius: 9px; display: inline-flex; align-items: center; gap: 7px; color: var(--text); font-size: 13.5px; font-weight: 500; }
  .cchip:hover { background: var(--hover); }
  .cchip .dim { color: var(--faint); font-weight: 400; }
  .send { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; }

  /* bots (Wisp hexagons with accessories; state shown by motion) */
  .bot { position: relative; display: inline-grid; place-items: center; flex: none; }
  .bot svg { overflow: visible; display: block; }
  .bot .w-eyes, .bot .w-eye { transform-box: fill-box; transform-origin: center; }
  .bot .dots { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; gap: 9%; padding-top: 4%; }
  .bot .dots b { width: 12%; aspect-ratio: 1; border-radius: 50%; background: #fff; animation: dot 1s ease-in-out infinite; }
  .bot .dots b:nth-child(2) { animation-delay: .15s; } .bot .dots b:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 50% { transform: translateY(-35%); opacity: .5; } }
  .bot[data-state="idle"] .w-eye { animation: blink 4.6s infinite; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  .bot[data-state="working"] svg { animation: hop .9s cubic-bezier(.3, 0, .3, 1) infinite; }
  .bot[data-state="working"] .w-eyes { animation: glance 1.8s ease-in-out infinite; }
  @keyframes hop { 50% { transform: translateY(-7%); } }
  @keyframes glance { 0%, 100% { transform: translateX(0); } 30% { transform: translateX(-9%); } 65% { transform: translateX(9%); } }
  .bot[data-state="thinking"] .w-eyes { opacity: 0; } .bot[data-state="thinking"] .dots { display: flex; }
  .bot[data-state="waiting"] svg { animation: sway 2.4s ease-in-out infinite; transform-origin: 50% 90%; }
  .bot[data-state="waiting"] .w-eye { transform: scaleY(.45); }
  @keyframes sway { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }

  /* ---------- Agents view ---------- */
  .board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; padding: 4px 24px 24px; }
  .col h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 13px; color: var(--dim); font-weight: 600; }
  .col h3 .count { color: var(--faint); font-weight: 400; }
  .task { padding: 14px; margin-bottom: 12px; transition: border-color .15s ease-out, transform .15s ease-out; }
  .task:hover { border-color: #3a3a3a; }
  .task .top { display: flex; align-items: center; gap: 10px; }
  .task .top b { font-size: 14px; font-weight: 600; display: block; }
  .task .top small { color: var(--faint); font-size: 12px; }
  .task .top .grow { flex: 1; min-width: 0; }
  .task p { margin: 10px 0 0; color: var(--dim); font-size: 13px; }
  .task .now { margin-top: 10px; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--dim); }
  .task .now svg { color: var(--faint); }
  .prog { height: 4px; border-radius: 4px; background: var(--hover); overflow: hidden; margin-top: 10px; }
  .prog i { display: block; height: 100%; border-radius: 4px; background: var(--accent); transition: width .6s cubic-bezier(.2, .8, .2, 1); }
  .thumb { margin-top: 10px; border-radius: 8px; border: 1px solid var(--card-border); background: #0c0c0c; height: 92px; position: relative; overflow: hidden; }
  .thumb .chrome { height: 16px; background: #1a1a1a; border-bottom: 1px solid #262626; }
  .thumb .hero { position: absolute; left: 10px; right: 10px; top: 26px; height: 22px; border-radius: 5px; background: linear-gradient(90deg, #2f6bff, #6aa6ff); }
  .thumb .l1, .thumb .l2, .thumb .l3 { position: absolute; left: 10px; height: 6px; border-radius: 3px; background: #2a2a2a; }
  .thumb .l1 { top: 56px; width: 60%; } .thumb .l2 { top: 66px; width: 44%; } .thumb .l3 { top: 76px; width: 52%; }
  .thumb .cur { position: absolute; width: 10px; height: 10px; animation: roam 5s ease-in-out infinite; left: 60%; top: 40%; }
  @keyframes roam { 25% { left: 30%; top: 60%; } 50% { left: 70%; top: 70%; } 75% { left: 45%; top: 30%; } }
  .acts { display: flex; gap: 8px; margin-top: 12px; }
  .proof { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12.5px; color: var(--green); }
  .proof.no { color: var(--warn); }
  .ask-dock { position: sticky; bottom: 0; padding: 18px 24px 20px; background: linear-gradient(transparent, var(--bg) 28%); z-index: 3; }
  .ask-dock .composer { max-width: 980px; margin: 0 auto; }

  /* ---------- Chat view (the app's home) ---------- */
  .art { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; pointer-events: none; }
  .home { position: relative; min-height: 100%; display: grid; place-content: center; grid-template-columns: min(800px, 100%); padding: 40px 24px; }
  .hex { width: 104px; height: 104px; margin: 0 auto 18px; }
  .home h1 { text-align: center; margin: 0 0 30px; font-size: 30px; font-weight: 500; letter-spacing: -.01em; }
  .home h1 u { text-decoration: none; border-bottom: 2px dotted rgba(255, 255, 255, .5); }
  .bento { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-top: 14px; }
  .bento .card { padding: 12px 14px; background: rgba(24, 24, 24, .92); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  .bento h4 { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-size: 13px; color: var(--dim); font-weight: 500; }
  .bento h4 svg { color: var(--faint); }
  .b-act { grid-column: span 4; } .b-rec { grid-column: span 2; } .b-tot, .b-pr, .b-mon { grid-column: span 2; }
  .dots-grid { display: grid; grid-template-columns: repeat(52, 1fr); gap: 3px; }
  .dots-grid i { aspect-ratio: 1; border-radius: 50%; background: #2a2a2a; }
  .dots-grid i.g1 { background: #1f5c3d; } .dots-grid i.g2 { background: #2f8f5b; } .dots-grid i.g3 { background: #4cc38a; }
  .lst { display: grid; gap: 6px; font-size: 13.5px; }
  .lst div { display: flex; gap: 8px; align-items: center; }
  .lst span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lst time { color: var(--faint); font-size: 12px; }
  .lst span.bot, .lst .pic0, .lst .pill { flex: none; }
  .pic0 { width: 20px; height: 20px; border-radius: 50%; background: #2f8f5b; color: #fff; font-size: 10px; font-weight: 700; display: inline-grid; place-items: center; }
  .bignum { font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .bignum small { font-size: 13px; color: var(--faint); font-weight: 400; }
  .thread { max-width: 820px; margin: 0 auto; padding: 24px 24px 160px; }
  .stamp { text-align: center; color: var(--faint); font-size: 12px; margin: 8px 0 16px; }
  .msg { display: flex; margin: 8px 0; } .msg.you { justify-content: flex-end; }
  .msg .b { max-width: 74%; padding: 10px 15px; border-radius: 20px; line-height: 1.5; }
  .msg.you .b { background: var(--bubble); } .msg.them .b { background: none; padding-left: 2px; }
  .ev { display: flex; justify-content: center; align-items: center; gap: 6px; color: var(--dim); font-size: 13px; margin: 14px 0; flex-wrap: wrap; }
  .chat-dock { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 24px 20px; background: linear-gradient(transparent, var(--bg) 30%); }
  .chat-dock .composer { max-width: 820px; margin: 0 auto; }

  /* ---------- Code view (IDE) ---------- */
  .ide { display: grid; grid-template-columns: 1fr 320px; grid-template-rows: 1fr 200px; height: 100%; }
  .editor { grid-row: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid var(--border); }
  .etabs { display: flex; background: var(--rail); border-bottom: 1px solid var(--border); flex: none; }
  .etab { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; font-size: 13px; color: var(--faint); border-right: 1px solid var(--border); cursor: pointer; }
  .etab.on { color: var(--text); background: var(--bg); box-shadow: inset 0 2px 0 var(--accent); }
  .etab .mod { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
  .crumbs { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 16px; font-size: 12.5px; color: var(--faint); border-bottom: 1px solid var(--border); flex: none; }
  .code { flex: 1; overflow: auto; font: 13px/20px var(--font-mono); padding: 8px 0; tab-size: 2; }
  .ln { display: flex; white-space: pre; }
  .ln .no { width: 52px; flex: none; text-align: right; padding-right: 16px; color: #5a5a5a; user-select: none; }
  .ln.add { background: rgba(76, 195, 138, .09); } .ln.add .no { color: var(--green); }
  .ln.cur { background: rgba(255, 255, 255, .04); }
  .ln .caret { display: inline-block; width: 2px; height: 16px; background: #ff5c9d; vertical-align: -3px; animation: blinkc 1s steps(1) infinite; }
  @keyframes blinkc { 50% { opacity: 0; } }
  .ln .who { display: inline-flex; margin-left: 6px; padding: 0 6px; border-radius: 4px; background: #ff5c9d; color: #fff; font: 600 11px/16px var(--font-ui); vertical-align: 1px; }
  .k { color: #c792ea; } .s { color: #a5d6a7; } .t { color: #82aaff; } .c { color: #6a737d; } .a { color: #ffcb6b; } .p { color: #89ddff; }
  .agentpane { grid-row: 1 / 3; grid-column: 2; display: flex; flex-direction: column; min-height: 0; background: var(--side); }
  .agentpane .ph { display: flex; align-items: center; gap: 10px; padding: 14px; border-bottom: 1px solid var(--border); }
  .agentpane .ph b { display: block; font-size: 14px; } .agentpane .ph small { color: var(--faint); font-size: 12px; }
  .agentpane .feed { flex: 1; overflow: auto; padding: 12px 14px; display: grid; gap: 10px; align-content: start; font-size: 13px; }
  .step { display: flex; align-items: flex-start; gap: 8px; color: var(--dim); }
  .step svg { color: var(--green); margin-top: 1px; }
  .step b { color: var(--text); font-weight: 500; }
  .step .d { color: var(--faint); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; }
  .hunk { border: 1px solid var(--card-border); border-radius: 10px; overflow: hidden; }
  .hunk .hh { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--card); font-size: 12.5px; }
  .hunk .hh .grow { flex: 1; }
  .hunk pre { margin: 0; padding: 6px 0; font: 12px/18px var(--font-mono); overflow: auto; }
  .hunk pre span { display: block; padding: 0 10px; white-space: pre; }
  .hunk pre .plus { background: rgba(76, 195, 138, .1); color: #b9f0cf; } .hunk pre .minus { background: rgba(239, 106, 90, .1); color: #ffc2b8; }
  .term { grid-row: 2; grid-column: 1; border-top: 1px solid var(--border); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; background: #0b0b0b; }
  .term .tt { display: flex; gap: 16px; padding: 0 14px; height: 34px; align-items: center; font-size: 12.5px; color: var(--faint); border-bottom: 1px solid var(--border); flex: none; }
  .term .tt span.on { color: var(--text); box-shadow: inset 0 -2px 0 var(--text); line-height: 34px; }
  .term pre { margin: 0; flex: 1; overflow: auto; padding: 8px 14px; font: 12.5px/19px var(--font-mono); color: #cfcfcf; }
  .term .ok { color: var(--green); } .term .dim { color: #6f6f6f; }
  .tree .row { min-height: 28px; padding: 3px 8px; gap: 6px; font-size: 13.5px; }
  .tree .row .ico { color: var(--faint); }
  .tree .ind1 { padding-left: 26px; } .tree .ind2 { padding-left: 44px; }
  .tree .edited { margin-left: auto; color: var(--warn); font-size: 11px; font-weight: 700; }

  /* ---------- PRs view ---------- */
  .pr { max-width: 1040px; margin: 0 auto; padding: 4px 24px 40px; }
  .pr .title { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .pr .title h1 { margin: 0; font-size: 22px; font-weight: 650; }
  .pr .meta { color: var(--faint); font-size: 13px; display: flex; align-items: center; gap: 8px; margin-bottom: 18px; }
  .pr .grid { display: grid; grid-template-columns: 1fr 300px; gap: 16px; }
  .pr .card { padding: 14px 16px; }
  .pr .card h4 { margin: 0 0 10px; font-size: 13px; color: var(--dim); font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .pr .summary { font-size: 14px; line-height: 1.6; } .pr .summary ul { margin: 8px 0 0; padding-left: 18px; color: var(--dim); }
  .checks .chk { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--card-border); font-size: 13.5px; }
  .checks .chk:first-of-type { border-top: 0; } .checks .chk .grow { flex: 1; } .checks .chk time { color: var(--faint); font-size: 12px; }
  .checks svg.okc { color: var(--green); } .checks svg.run { color: var(--warn); }
  .diff { margin-top: 16px; } .diff .fh { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--card-border); font-size: 13px; }
  .diff .fh .grow { flex: 1; } .diff .fh .plus { color: var(--green); } .diff .fh .minus { color: var(--red); }
  .diff pre { margin: 0; padding: 6px 0; font: 12.5px/20px var(--font-mono); overflow: auto; }
  .diff pre span { display: flex; white-space: pre; } .diff pre span i { width: 44px; flex: none; text-align: right; padding-right: 12px; color: #5a5a5a; font-style: normal; user-select: none; }
  .diff pre .plus { background: rgba(76, 195, 138, .1); } .diff pre .minus { background: rgba(239, 106, 90, .1); }
  .pr-row .nm b { font-weight: 500; }

  /* ---------- Mail view ---------- */
  .mail { display: grid; grid-template-columns: 380px 1fr; height: 100%; }
  .mlist { border-right: 1px solid var(--border); overflow: auto; }
  .mitem { padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .12s ease-out; }
  .mitem:hover { background: var(--hover); } .mitem.on { background: var(--active); }
  .mitem .f { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
  .mitem .f time { margin-left: auto; color: var(--faint); font-weight: 400; font-size: 12px; }
  .mitem .sj { font-size: 13.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mitem .pv { font-size: 12.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .mitem .tags { display: flex; gap: 6px; margin-top: 8px; }
  .mitem.unread .f::before { content: ""; width: 3px; height: 14px; border-radius: 2px; background: var(--accent); margin-left: -10px; margin-right: 5px; }
  .mread { overflow: auto; padding: 22px 32px 40px; }
  .mread h2 { margin: 0 0 6px; font-size: 20px; font-weight: 650; }
  .mread .from { display: flex; align-items: center; gap: 10px; color: var(--dim); font-size: 13px; margin-bottom: 18px; }
  .mread .av { width: 34px; height: 34px; border-radius: 50%; background: #3a3a3a; display: grid; place-items: center; font-weight: 700; color: #fff; }
  .mread .body { font-size: 14.5px; line-height: 1.65; max-width: 680px; }
  .draft { margin-top: 24px; max-width: 680px; padding: 14px 16px; }
  .draft .dh { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; color: var(--dim); }
  .draft .dh .grow { flex: 1; }
  .draft .db { font-size: 14px; line-height: 1.6; padding: 10px 12px; border-radius: 10px; background: #181818; border: 1px solid var(--card-border); }

  .fade { animation: fade .28s cubic-bezier(.2, .8, .2, 1); }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<body>
<div class="app">
  <header class="titlebar">
    <div class="brand"><span id="logo"></span>Codeply</div>

<script>
(function () {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const ico = (name, cls) => window.icon(name, cls || '');
  const B = window.CodeplyIcons;

  // ---------- the team (Wisp leads; helpers are Claude Code agents on the user's plan) ----------
  const TEAM = {
    wisp: { name: 'Wisp', color: '#2f6bff', state: 'idle', role: 'Your agent' },
    frontend: { name: 'Frontend', color: '#ff5c9d', gear: 'beret', state: 'working', role: 'Claude Code' },
    backend: { name: 'Backend', color: '#ff8a1a', gear: 'headphones', state: 'thinking', role: 'Claude Code' },
    inbox: { name: 'Inbox', color: '#1fc75f', gear: 'glasses', state: 'waiting', role: 'Mail' },
    research: { name: 'Research', color: '#7b5cff', gear: 'sprout', state: 'idle', role: 'Web' },
  };
  const bot = (id, size) => { const a = TEAM[id]; return `<span class="bot" data-state="${a.state}" style="width:${size}px;height:${size}px">${B.svg('wisp', { size, color: a.color, gear: a.gear })}<i class="dots"><b></b><b></b><b></b></i></span>`; };

  // ---------- composer (the shipping app's, with project tab, approvals and model) ----------
  const composer = (ph, proj = true, compact = false) => `<div class="composer">
      ${proj ? `<div class="proj">${ico('oai-folder')}launch-site</div>` : ''}
      <textarea placeholder="${ph}"></textarea>
      <div class="bar">
        <button class="ibtn" title="Attach">${ico('plus')}</button>
        ${compact ? '' : `<button class="cchip">${ico('shield-check', 's16')}Approve manually</button>`}
        <span class="grow"></span>
        ${compact ? '' : `<button class="cchip">Haze 2 <span class="dim">High</span>${ico('chevron-down', 's16')}</button>`}
        <button class="ibtn" title="Voice">${ico('mic')}</button>
        <button class="send" title="Send">${ico('arrow-up', 's16')}</button>
      </div></div>`;

  // ======================= BOARD (the office as a list) =======================
  function agents() {
    side(`<div class="side-head"><h2>Agents</h2><button class="ibtn" title="New agent">${ico('plus')}</button></div>
      <div class="side-scroll">
        <div class="row on">${bot('wisp', 36)}<div class="nm">Wisp<small>Watching your day. Brief at 6:00</small></div><time>now</time></div>
        <div class="sec">Wisp's team</div>
        ${['frontend', 'backend', 'inbox', 'research'].map((id) => {
          const st = { frontend: 'Building the pricing page', backend: 'Thinking about plan limits', inbox: 'Needs your OK on 1 reply', research: '4 venues for Friday' }[id];
          return `<div class="row">${bot(id, 32)}<div class="nm">${TEAM[id].name}<small>${st}</small></div></div>`;
        }).join('')}
        <div class="sec">Routines</div>
        <div class="row">${ico('sun')}<div class="nm">Morning brief<small>Every day at 6:00</small></div></div>
        <div class="row">${ico('mail')}<div class="nm">Inbox cleanup<small>Weekdays at 8:00</small></div></div>
        <div class="row">${ico('history')}<div class="nm">Weekly review<small>Fridays at 17:00</small></div></div>
      </div>${me()}`);
    view(`<div class="head"><div><h1>Mission control</h1><div class="sub">Wisp and 4 helpers. 2 working, 1 needs you, 5 done today.</div></div><span class="grow"></span>
        <div class="seg"><button data-go="office">Office</button><button class="on">Board</button></div>

      <div class="board fade">
        <section class="col"><h3>${ico('refresh', 's16')}Working <span class="count">2</span></h3>
          <div class="card task"><div class="top">${bot('frontend', 30)}<div class="grow"><b>Pricing page for launch-site</b><small>Frontend · Claude Code · 14 min</small></div><span class="pill blue">Code</span></div>
            <div class="now">${ico('edit', 's16')}Editing pricing.html, +42 lines</div><div class="prog"><i style="width:64%"></i></div>
            <div class="thumb"><div class="chrome"></div><div class="hero"></div><i class="l1"></i><i class="l2"></i><i class="l3"></i><svg class="cur" viewBox="0 0 24 24"><path d="M4 2l16 9-7 2-3 7z" fill="#ff5c9d" stroke="#fff" stroke-width="1.5"/></svg></div></div>
          <div class="card task"><div class="top">${bot('backend', 30)}<div class="grow"><b>Plan data and limits</b><small>Backend · Claude Code · 6 min</small></div><span class="pill blue">Code</span></div>
            <div class="now">${ico('terminal', 's16')}Running npm test</div><div class="prog"><i style="width:30%"></i></div></div>
        </section>
        <section class="col"><h3>${ico('bell', 's16')}Needs you <span class="count">2</span></h3>
          <div class="card task"><div class="top">${bot('inbox', 30)}<div class="grow"><b>Reply to the landlord</b><small>Inbox · drafted 18 min ago</small></div><span class="pill warn">Approve</span></div>
            <p>"Thanks for the renewal. The 1st works, and I'll send the deposit by Friday."</p>
            <div class="acts"><button class="btn blue">Send</button><button class="btn">Edit</button><button class="btn">Discard</button></div></div>
          <div class="card task"><div class="top">${bot('research', 30)}<div class="grow"><b>Book the Friday venue?</b><small>Research · 4 options</small></div><span class="pill warn">Decide</span></div>
            <p>Top pick holds 20 people, 10 minutes from the office, $240 for the evening.</p>
            <div class="acts"><button class="btn blue">Book it</button><button class="btn">See all 4</button></div></div>
        </section>
        <section class="col"><h3>${ico('check', 's16')}Done today <span class="count">5</span></h3>
          ${[['wisp', 'Moved standup to 9:30', 'Checked on Google Calendar'], ['frontend', 'Hero section shipped to preview', 'Tests passed, 212 of 212'], ['inbox', 'Archived 41 newsletters', 'Kept everyone you know'], ['backend', 'Fixed the checkout crash', 'PR #42 opened'], ['wisp', 'Internet bill reminder', 'Not checked: no bill found', true]]
            .map(([id, t, p, no]) => `<div class="card task"><div class="top">${bot(id, 26)}<div class="grow"><b>${t}</b><small>${TEAM[id].name}</small></div></div><div class="proof${no ? ' no' : ''}">${ico(no ? 'help' : 'check', 's16')}${p}</div></div>`).join('')}
        </section>
      </div>
      <div class="ask-dock">${composer('Give Wisp a task, or ask how things are going')}</div>`);
  }

  // ======================= CHAT (the app's home) =======================
  function chat(open) {
    side(`<div class="side-head"><h2>Chats</h2><button class="ibtn" title="New chat">${ico('oai-compose')}</button></div>
      <div class="side-scroll">
        ${[['oai-desktop', 'This Computer', ['Casual chat', 'Parallel greeting agents test', 'Getting acquainted with Codeply']], ['oai-cloud', 'Cloud', ['Nightly test run', 'Docs refresh']], ['oai-folder', 'launch-site', ['Pricing page', 'Local site mockup fixes', 'Git push command explanation']]]
          .map(([i, t, list]) => `<div class="sec">${ico(i)}<span class="grow">${t}</span>${ico('plus', 's16')}</div>${list.map((c) => `<div class="row${open === c ? ' on' : ''}" data-chat="${c}"><div class="nm">${c}</div></div>`).join('')}`).join('')}
      </div>${me()}`);
    if (!open) {
      view(`<canvas class="art" id="art"></canvas><div class="home fade">
          <div class="hex">${B.svg('wisp', { size: 104 })}</div>
          <h1>What should we build in <u>launch-site</u>?</h1>

          <div class="bento">
            <div class="card b-act"><h4>${ico('chart', 's16')}Activity</h4><div class="dots-grid">${Array.from({ length: 52 * 7 }, (_, i) => { const r = Math.random(), late = i % 52 > 40; return `<i class="${late && r > .45 ? (r > .8 ? 'g3' : r > .62 ? 'g2' : 'g1') : r > .97 ? 'g1' : ''}"></i>`; }).join('')}</div>
              <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--faint)"><span>38 active days · 77.8m tokens</span><span>Last 12 months</span></div></div>
            <div class="card b-rec"><h4>${ico('history', 's16')}Recent chats</h4><div class="lst"><div><span>Casual chat</span><time>24 h ago</time></div><div><span>Local site mockup fixes</span><time>2 days ago</time></div><div><span>iMessage clone build</span><time>3 days ago</time></div></div></div>
            <div class="card b-tot"><h4>${ico('gauge', 's16')}Total</h4><div class="bignum">77.8m <small>tokens</small></div></div>
            <div class="card b-pr"><h4>${ico('branch', 's16')}Pull requests</h4><div class="lst"><div><span>Pricing page for launch-site</span><time>2 h</time></div><div><span>Admin dashboard: progress</span><time>7 d</time></div></div></div>
            <div class="card b-mon"><h4>${ico('calendar', 's16')}This month</h4><div class="bignum">23 <small>chats</small></div></div>
          </div></div>`);
      requestAnimationFrame(drawArt);
    } else {
      view(`<div class="thread fade"><div class="stamp">9:41 AM</div>

          <div class="msg them"><div class="b">On it. Pinging everyone for status now.</div></div>
          <div class="ev">6 messages with ${bot('frontend', 18)} Frontend ${bot('backend', 18)} Backend and ${bot('inbox', 18)} Inbox</div>

  // ======================= CODE (IDE) =======================
  const SRC = [
    ['c', '// Pricing: three plans, monthly or yearly, matching the homepage.'],
    ['', '<span class="k">import</span> { plans } <span class="k">from</span> <span class="s">"./plans.json"</span>;'],
    ['', ''],
    ['', '<span class="k">export function</span> <span class="t">renderPricing</span>(<span class="a">root</span>, { <span class="a">yearly</span> = <span class="k">false</span> } = {}) {'],
    ['', '  <span class="k">const</span> cards = plans.<span class="t">map</span>((<span class="a">p</span>) =&gt; {'],
    ['', '    <span class="k">const</span> price = yearly ? p.yearly : p.monthly;'],
    ['add', '    <span class="k">const</span> save = yearly ? <span class="t">Math</span>.<span class="t">round</span>((<span class="p">1</span> - p.yearly / (p.monthly * <span class="p">12</span>)) * <span class="p">100</span>) : <span class="p">0</span>;'],

    ['add', '<span class="s">      &lt;p class="price"&gt;$${price}&lt;small&gt;/${yearly ? "yr" : "mo"}&lt;/small&gt;&lt;/p&gt;</span>'],

    ['', '<span class="s">    &lt;/article&gt;`</span>;'],
    ['', '  });'],
    ['', '  root.innerHTML = cards.<span class="t">join</span>(<span class="s">""</span>);'],
    ['', '}'],
    ['', ''],
    ['c', '// The switch: one click flips every card, no reload.'],
    ['', '<span class="k">export function</span> <span class="t">bindToggle</span>(<span class="a">root</span>, <span class="a">toggle</span>) {'],
    ['', '  toggle.<span class="t">addEventListener</span>(<span class="s">"change"</span>, () =&gt; <span class="t">renderPricing</span>(root, { yearly: toggle.checked }));'],
    ['', '}'],
  ];
  function code() {
    side(`<div class="side-head"><h2>launch-site</h2><button class="ibtn" title="Open folder">${ico('oai-folder')}</button></div>
      <div class="side-scroll tree">
        <div class="sec">${ico('branch', 's16')}<span class="grow">claude/pricing-page</span></div>

        <div class="row ind1">${ico('chevron-right', 's16')}${ico('folder', 's16')}<div class="nm">components</div></div>
        <div class="row ind1">${ico('file-text', 's16')}<div class="nm">main.js</div></div>

    view(`<div class="ide fade">

          <div class="code">${SRC.map(([cls, html], i) => `<div class="ln ${cls}"><span class="no">${i + 1}</span><span class="${cls === 'c' ? 'c' : ''}">${html}</span></div>`).join('')}</div>
        </div>
        <aside class="agentpane">
          <div class="ph">${bot('frontend', 32)}<div><b>Frontend is editing</b><small>Claude Code on your plan</small></div></div>
          <div class="feed">
            <div class="step">${ico('check', 's16')}<span>Read <b>index.html</b> and the homepage styles</span><span class="d">0:12</span></div>
            <div class="step">${ico('check', 's16')}<span>Asked Backend for the plan data</span><span class="d">1:40</span></div>
            <div class="step">${ico('check', 's16')}<span>Created <b>plans.json</b></span><span class="d">2:05</span></div>
            <div class="step">${ico('refresh', 's16')}<span>Editing <b>pricing.js</b></span><span class="d">now</span></div>
            <div class="hunk"><div class="hh">${ico('file-text', 's16')}pricing.js<span class="grow"></span><span class="pill green">+5</span></div>
              <pre><span class="plus">+ const save = yearly ? Math.round(...) : 0;</span><span class="plus">+ return \`&lt;article class="plan..."&gt;</span><span class="minus">- return \`&lt;div class="plan"&gt;</span></pre></div>
            <div class="acts"><button class="btn green">Keep</button><button class="btn">Undo</button><button class="btn">${ico('external', 's16')}Preview</button></div>
          </div>
          <div style="padding:10px 12px 12px;border-top:1px solid var(--border)">${composer('Tell Frontend what to change', false, true)}</div>
        </aside>
        <div class="term"><div class="tt"><span class="on">Terminal</span><span>Problems</span><span>Output</span></div>
          <pre><span class="dim">~/launch-site</span> npm test
<span class="ok">PASS</span> src/pricing/pricing.test.js
  pricing
    <span class="ok">✓</span> renders three plans (4 ms)
    <span class="ok">✓</span> yearly shows the saving (2 ms)
    <span class="ok">✓</span> toggle re-renders without reload (3 ms)

Tests: <span class="ok">212 passed</span>, 212 total
<span class="dim">~/launch-site</span> </pre></div>
      </div>`);
  }

  // ======================= PRs =======================
  const PRS = [
    { n: 44, t: 'Pricing page for launch-site', by: 'frontend', st: 'open', age: '2h', add: 186, del: 12, branch: 'claude/pricing-page', sum: 'A pricing page with three plans and a monthly or yearly switch, styled like the homepage.', pts: ['New <b>plans.json</b> from Backend, one source for names and prices', 'Yearly shows the saving per plan', 'Checked at 375, 768 and 1440 px; no layout shift'] },
    { n: 43, t: 'Plan data and limits', by: 'backend', st: 'draft', age: '6m', add: 48, del: 3, branch: 'claude/plan-data', sum: 'Plan names, prices and usage limits in one file the page and the API both read.', pts: ['<b>plans.json</b> with Free, Plus and Team', 'Limits enforced in the API, not just shown', 'Still running the test suite'] },
    { n: 42, t: 'Fix the checkout crash', by: 'backend', st: 'open', age: '1d', add: 9, del: 4, branch: 'claude/checkout-nan', sum: 'Checkout crashed when a coupon made the total NaN. Totals are now clamped and the coupon is checked first.', pts: ['Reproduced the crash with an empty coupon', 'Clamp NaN to 0 in <b>math.ts</b>', 'New test covers the empty coupon case'] },
    { n: 41, t: 'Admin dashboard: progress', by: 'frontend', st: 'merged', age: '7d', add: 402, del: 120, branch: 'claude/admin-progress', sum: 'A progress section on the admin dashboard with weekly charts.', pts: ['Charts render from the existing stats API', 'Empty state for new accounts', 'Merged by you'] },
  ];
  function prs(pick = 44) {
    const p = PRS.find((x) => x.n === pick);
    const pill = (st) => ({ open: '<span class="pill green">Open</span>', draft: '<span class="pill gray">Draft</span>', merged: '<span class="pill purple">Merged</span>' })[st];
    side(`<div class="side-head"><h2>Pull requests</h2><button class="ibtn" title="Filter">${ico('menu')}</button></div>
      <div class="side-scroll"><div class="sec">launch-site</div>
        ${PRS.map((x) => `<div class="row pr-row${x.n === pick ? ' on' : ''}" data-pr="${x.n}">${bot(x.by, 26)}<div class="nm"><b>${x.t}</b><small>#${x.n} · ${TEAM[x.by].name} · ${x.age}</small></div></div>`).join('')}
      </div>${me()}`);
    view(`<div class="pr fade">
        <div class="head" style="padding-left:0;padding-right:0"><div class="title">${pill(p.st)}<h1>${p.t} <span style="color:var(--faint);font-weight:400">#${p.n}</span></h1></div><span class="grow"></span><button class="btn">${ico('external', 's16')}Open on GitHub</button><button class="btn green">Merge</button></div>
        <div class="meta">${bot(p.by, 18)} ${TEAM[p.by].name} wants to merge <b style="color:var(--text)">${p.branch}</b> into <b style="color:var(--text)">main</b> · ${p.age} ago</div>
        <div class="grid">
          <div>
            <div class="card summary"><h4>${ico('sparkle', 's16')}What changed, from the agent</h4>${p.sum}
              <ul>${p.pts.map((x) => `<li>${x}</li>`).join('')}</ul></div>
            ${p.n !== 44 ? `<div class="card diff"><div class="fh">${ico('file-text', 's16')}${p.add + p.del} lines in ${Math.max(1, Math.round((p.add + p.del) / 60))} files<span class="grow"></span><span class="plus">+${p.add}</span><span class="minus">-${p.del}</span></div></div>` : ''}
            ${p.n === 44 ? `<div class="card diff"><div class="fh">${ico('file-text', 's16')}src/pricing/pricing.js<span class="grow"></span><span class="plus">+${p.add}</span><span class="minus">-${p.del}</span></div>
              <pre><span><i>18</i>  const cards = plans.map((p) =&gt; {</span><span><i>19</i>    const price = yearly ? p.yearly : p.monthly;</span><span class="plus"><i>20</i>+   const save = yearly ? Math.round((1 - p.yearly / (p.monthly * 12)) * 100) : 0;</span><span class="minus"><i>21</i>-   return \`&lt;div class="plan"&gt;</span><span class="plus"><i>21</i>+   return \`&lt;article class="plan\${p.featured ? " featured" : ""}"&gt;</span><span class="plus"><i>22</i>+     \${save ? \`&lt;span class="save"&gt;Save \${save}%&lt;/span&gt;\` : ""}</span><span><i>23</i>    &lt;/article&gt;\`;</span></pre></div>` : ''}
          </div>
          <div>
            <div class="card checks"><h4>${ico('shield-check', 's16')}Checks</h4>
              <div class="chk">${ico('check', 's16 okc')}<span class="grow">Tests · 212 passed</span><time>48s</time></div>
              <div class="chk">${ico('check', 's16 okc')}<span class="grow">Type check</span><time>12s</time></div>
              <div class="chk">${ico('check', 's16 okc')}<span class="grow">Browser check · 3 sizes</span><time>31s</time></div>
              <div class="chk">${ico('refresh', 's16 run')}<span class="grow">Preview deploy</span><time>running</time></div></div>
            <div class="card" style="margin-top:12px"><h4>${ico('users', 's16')}Reviewers</h4><div class="lst"><div>${bot('wisp', 20)}<span>Wisp reviewed it</span><span class="pill green">OK</span></div><div><span class="pic0">S</span><span>You</span><span class="pill gray">Pending</span></div></div></div>
          </div>
        </div></div>`);
  }

  // ---------- shell ----------
  const me = () => `<div class="me"><span class="pic">S</span><div class="grow">Sam<small>Free plan</small></div><button class="ibtn" title="Settings">${ico('oai-settings')}</button></div>`;
  const side = (html) => { $('#side').innerHTML = html; };
  const view = (html) => { $('#view').innerHTML = html; };
  // Helpers handed to views.js (Office and Apps).
  const api = { ico, B, TEAM, bot, composer, side: (h) => side(h), view: (h) => view(h), me: () => me(), go: (n) => go(n), $ };
  const VIEWS = { office: () => window.CWViews.office(api), board: agents, chat, code, prs, apps: () => window.CWViews.apps(api) };
  const RAIL = { board: 'office' };
  function go(name) {
    if (!VIEWS[name]) name = 'office';
    document.querySelectorAll('.rail .tab[data-view]').forEach((t) => t.classList.toggle('on', t.dataset.view === (RAIL[name] || name)));
    document.querySelector('.app').classList.toggle('no-side', name === 'office');
    VIEWS[name]();
    try { localStorage.setItem('cw-view', name); } catch {}
  }
  document.addEventListener('click', (e) => {
    const t = e.target.closest('.rail .tab[data-view]'); if (t) { go(t.dataset.view); return; }
    const g = e.target.closest('[data-go]'); if (g) { go(g.dataset.go); return; }
    const ag = e.target.closest('.agent[data-agent]'); if (ag) { window.CWViews.openDrawer(api, ag.dataset.agent); return; }
    const dr = document.getElementById('drawer');
    if (dr && dr.classList.contains('open') && (e.target.closest('[data-close-drawer]') || !e.target.closest('.drawer'))) { dr.classList.remove('open'); document.querySelectorAll('.agent.sel').forEach((x) => x.classList.remove('sel')); }
    const c = e.target.closest('[data-chat]'); if (c) { chat(c.dataset.chat); return; }
    const p = e.target.closest('[data-pr]'); if (p) { prs(Number(p.dataset.pr)); return; }
    const s = e.target.closest('.seg button'); if (s) { s.parentNode.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b === s)); }
  });
  addEventListener('keydown', (e) => { if (e.key === 'Escape') { const dr = document.getElementById('drawer'); if (dr) dr.classList.remove('open'); } });
  // Rail tooltips.
  const tip = $('#tipl');
  document.addEventListener('mouseover', (e) => {
    const t = e.target.closest('[data-tip]');
    if (!t) { tip.classList.remove('show'); return; }
    const r = t.getBoundingClientRect(); tip.textContent = t.dataset.tip;
    tip.style.left = `${Math.round(r.right + 10)}px`; tip.style.top = `${Math.round(r.top + r.height / 2 - 14)}px`; tip.classList.add('show');
  });
  addEventListener('keydown', (e) => { if (e.ctrlKey && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#cmdk').animate([{ transform: 'scale(1)' }, { transform: 'scale(1.015)' }, { transform: 'scale(1)' }], 200); } });

  // ---------- the app's dithered space art (Chat home) ----------
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16);
  function drawArt() {
    const c = document.getElementById('art'); if (!c) return;
    const px = 3, W = Math.ceil(c.clientWidth / px), H = Math.ceil(c.clientHeight / px);
    if (!W || !H) return;
    c.width = W; c.height = H;
    const x = c.getContext('2d'), img = x.createImageData(W, H);
    let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
      const u = i / W, v = j / H;
      // A soft warp band sweeping up from the lower left: fine dithered sparks, blue above the core, red below.
      const centre = 0.62 + 0.22 * Math.sin(u * 2.2 - 0.9);
      const band = v - centre;
      const g = Math.exp(-(band * band) / 0.012);
      const n = rnd();
      const streak = 0.55 + 0.45 * Math.sin(u * 48 + v * 12 + Math.sin(u * 5) * 2);
      const k = g * streak * (0.35 + 0.65 * n);
      let r, gg, b;
      if (Math.abs(band) < 0.012) { r = 235; gg = 238; b = 245; }
      else if (band < 0) { r = 70; gg = 110; b = 255; }
      else { r = 225; gg = 55; b = 70; }
      const t = BAYER[(j % 4) * 4 + (i % 4)];
      const on = k > t * 0.95 + 0.08;
      const o = (j * W + i) * 4;
      const dim = on ? 0.35 + 0.5 * k : 0;
      img.data[o] = r * dim; img.data[o + 1] = gg * dim; img.data[o + 2] = b * dim; img.data[o + 3] = 255;
      if (rnd() < 0.0025) { const w = 120 + rnd() * 110; img.data[o] = img.data[o + 1] = img.data[o + 2] = w; }
    }
    x.putImageData(img, 0, 0);
  }
  addEventListener('resize', () => requestAnimationFrame(drawArt));

  $('#logo').innerHTML = B.svg('wisp', { size: 24 });
  window.fillIcons(document);
  let start = 'office'; try { start = localStorage.getItem('cw-view') || 'office'; } catch {}
  go(VIEWS[start] ? start : 'office');
})();
</script>
</body>
</html>
