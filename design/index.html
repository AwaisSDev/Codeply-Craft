<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: file: codeply-design:; frame-src file: codeply-design:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Codeply Design</title>
<script src="../drop/theme.js"></script>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="design.css">
</head>
<body class="dz-body-root">
<div class="dz">
  <!-- Craft's sidebar, with the switch on Design and your designs in place of chats -->
  <aside class="sidebar dz-side" id="side">
    <div class="sb-header">
    </div>
    <!-- a few actions, then the designs in categories that fold away -->
    <div class="dz-scroll">
      <label class="dz-search" id="searchBox" hidden>
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" type="search" placeholder="Search designs" aria-label="Search designs" autocomplete="off" spellcheck="false">
      </label>
      <nav class="dz-actions" aria-label="Actions">
        <button class="dz-row" id="newBtn" type="button"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span><span class="label">New design</span></button>
        <button class="dz-row" id="searchBtn" type="button" aria-expanded="false" aria-controls="searchBox" title="Search (Ctrl+K)"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span><span class="label">Search</span></button>
        <button class="dz-row" id="catBtn" type="button"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M12 11v5M9.5 13.5h5"/></svg></span><span class="label">New category</span></button>
      </nav>
      <div class="dz-list" id="list"></div>
    </div>
  </aside>

  <main class="dz-main">
    <!-- start: Craft's home, for designs -->
    <section class="dz-home" id="start">
      <div class="main-topbar"><span></span><div class="topbar-icons"></div></div>
      <div class="home-center">

        <h1 class="home-title">What should we design?</h1>
        <div class="dz-recent" id="recent"></div>
      </div>
      <div class="composer-wrap home-composer">
        <div class="composer-tray dz-tray" id="kinds" role="group" aria-label="Kind of design"></div>
        <div class="composer dz-composer" id="startComposer">
          <div class="dz-ctx-row" id="startCtx" hidden></div>
          <div class="dz-attach-row" id="startAtt" hidden></div>
          <textarea class="composer-input" id="startInput" rows="1" placeholder="Describe what to design: what it is, who it's for, the feel"></textarea>
          <div class="composer-bottom">
            <div class="composer-bottom-left">
              <button class="attach-btn" id="startAttach" type="button" title="Add reference images"><svg viewBox="0 0 24 24"><path d="M21.4 11.1 12.2 20.3a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg></button>
              <input type="file" id="startFile" accept="image/*" multiple hidden>
              <span class="chip dz-only" title="Codeply Design makes designs only. When a website or app should work, Build it in Craft.">
                <svg viewBox="0 0 24 24"><path d="M12 3.5 13.9 9l5.6 1.9-5.6 1.9L12 18.5l-1.9-5.7L4.5 10.9 10.1 9z"/></svg>
                <span>Designs only</span>
              </span>
            </div>
            <div class="composer-bottom-right">
              <button class="send-btn" id="startSend" type="button" title="Design it" disabled><svg class="ic-send" viewBox="0 0 24 24"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></svg></button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- one design: its chat beside the canvas -->
    <section class="dz-work" id="work" hidden>
      <div class="dz-chat">
        <div class="chat-topbar dz-chat-top">
          <div class="chat-title-group">
            <span class="dz-kind-ico" id="dKindIco" aria-hidden="true"></span>
            <span class="chat-title dz-title" id="dTitle" title="Double-click to rename">Untitled design</span>
          </div>
          <div class="topbar-icons">
            <button class="icon-btn" id="renameBtn" type="button" title="Rename"><svg viewBox="0 0 24 24"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
            <button class="icon-btn" id="moreBtn" type="button" title="More" data-menu><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
          </div>
        </div>
        <div class="dz-thread" id="thread"><div class="dz-feed" id="feed"></div></div>
        <div class="composer-wrap dz-chat-composer">
          <div class="composer dz-composer" id="chatComposer">
            <div class="dz-attach-row" id="chatAtt" hidden></div>
            <textarea class="composer-input" id="input" rows="1" placeholder="Ask for changes"></textarea>
            <div class="composer-bottom">
              <div class="composer-bottom-left">
                <button class="attach-btn" id="chatAttach" type="button" title="Add reference images"><svg viewBox="0 0 24 24"><path d="M21.4 11.1 12.2 20.3a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg></button>
                <input type="file" id="chatFile" accept="image/*" multiple hidden>
                <span class="dz-note" id="chatNote"></span>
              </div>
              <div class="composer-bottom-right">
                <button class="send-btn" id="sendBtn" type="button" title="Send" disabled><svg class="ic-send" viewBox="0 0 24 24"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></svg><svg class="ic-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></svg></button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="dz-stage">
        <div class="dz-stage-top">
          <div class="dz-devices" id="sizes" role="group" aria-label="Width">
            <button type="button" data-w="1440" title="Desktop (1440)"><svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M8.5 20h7M12 16.5V20"/></svg></button>
            <button type="button" data-w="768" title="Tablet (768)"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2.2"/><path d="M11 18h2"/></svg></button>
            <button type="button" data-w="390" title="Phone (390)"><svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2.2"/><path d="M11 18h2"/></svg></button>
          </div>
          <span class="dz-size-label" id="sizeLabel"></span>
          <span class="dz-spacer"></span>
          <button class="icon-btn" id="reloadBtn" type="button" title="Reload the preview"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
          <button class="icon-btn" id="openBtn" type="button" title="Open in your browser"><svg viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/></svg></button>
          <button class="btn btn-secondary dz-btn" id="exportBtn" type="button" data-menu>
            <svg viewBox="0 0 24 24"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg>
            Export
          </button>
          <button class="btn btn-primary dz-btn" id="buildBtn" type="button" title="Copy this design into a new project and have Craft make it work">
            <svg viewBox="0 0 24 24"><path d="m14 4-4 16"/><path d="M7 8l-4 4 4 4"/><path d="M17 8l4 4-4 4"/></svg>
            Build it in Craft
          </button>
        </div>
        <div class="dz-canvas" id="canvas">
          <div class="dz-frame" id="frameWrap">
            <div class="dz-chrome" id="chrome"><i></i><i></i><i></i><span class="dz-url" id="chromeUrl"></span></div>
            <div class="dz-viewport" id="viewport"><iframe id="frame" title="Design preview" sandbox="allow-scripts"></iframe></div>
          </div>
          <div class="dz-waiting" id="waiting"><span class="spin"></span><span class="shine">Designing</span></div>
        </div>
      </div>
    </section>
  </main>
</div>
<div class="dz-menu" id="menu" hidden></div>
<script src="../crew/markdown.js"></script>
<script src="design.js"></script>
</body>
</html>
