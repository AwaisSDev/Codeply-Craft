<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#1f1f1e" id="themeColorMeta">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Codeply</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="phone-favicon.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="stylesheet" href="phone.css">
  <link rel="stylesheet" href="phone-calls.css">
  <script>
    // Apply a stored dark/light choice before first paint.
    (function () {
      try {
        var t = localStorage.getItem('craft-theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!-- SIGN IN -->
  <section class="signin hidden" id="signin">
    <div class="signin-inner">
      <img class="signin-mark" src="logo.png" alt="">
      <h1 class="serif">Sign in to Codeply</h1>
      <p class="muted">Use the same account as Codeply on your computer.</p>

      <form class="signin-form" id="loginForm">
        <input id="loginEmail" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="Email" required>
        <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Password" required>
        <button class="btn btn-primary" type="submit" id="loginBtn">Sign in</button>
        <p class="form-error hidden" id="loginError"></p>
        <button class="link-btn" id="useCodeBtn" type="button">No password? Email me a sign-in code</button>
      </form>

      <form class="signin-form hidden" id="otpForm">
        <p class="muted" id="otpSentTo">We emailed you a sign-in code.</p>
        <input id="loginOtp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="12" placeholder="Code from the email" required>
        <button class="btn btn-primary" type="submit">Sign in</button>
        <p class="form-error hidden" id="otpError"></p>
        <button class="link-btn" id="otpBackBtn" type="button">Back to password sign-in</button>
      </form>

      <div class="signin-busy hidden" id="signinBusy"><span class="spinner"></span><span id="signinBusyText">Signing in...</span></div>
    </div>
  </section>

  <!-- APP -->
  <section class="app hidden" id="app">
    <header class="top">
      <button class="icon-btn" id="menuBtn" aria-label="Open sidebar">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h10M4 17h16"/></svg>
      </button>
      <div class="top-title" id="topTitle"></div>
      <button class="icon-btn" id="newChatTopBtn" aria-label="New chat">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/><path d="M17.5 3.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>
      </button>
    </header>

    <main class="scroll" id="scroll">
      <div class="empty" id="empty">
        <img class="empty-mark" src="logo.png" alt="">
        <h1 class="greeting serif" id="greeting">Hello</h1>
        <p class="empty-sub hidden" id="emptySub"></p>
      </div>
      <div class="feed hidden" id="feed" aria-live="polite"></div>
    </main>

    <form class="composer" id="composer">
      <div class="ctx-row hidden" id="ctxRow">
        <button type="button" class="ctx-chip" id="projectChip">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
          <span id="projectChipName">Choose project</span>
        </button>
        <button type="button" class="ctx-chip" id="codeModeChip"><span id="codeModeName">Build</span></button>
        <span class="ctx-status" id="pcStatus"><i></i><span>PC offline</span></span>
      </div>
      <div class="box">
        <textarea id="input" rows="1" placeholder="Ask Codeply anything"></textarea>
        <div class="box-row">
          <button type="button" class="round-btn" id="plusBtn" aria-label="More">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <div class="switch" id="modeSwitch" role="group" aria-label="Chat or Code">
            <button type="button" data-ui-mode="chat">Chat</button>
            <button type="button" data-ui-mode="code">Code</button>
          </div>
          <span class="spacer"></span>
          <button type="button" class="model-btn" id="modelBtn"><span id="modelName">Auto</span></button>
          <button type="submit" class="send-btn" id="sendBtn" aria-label="Send">
            <svg id="sendIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
            <svg id="stopIcon" class="hidden" viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
          </button>
        </div>
      </div>
    </form>
  </section>

  <!-- SIDEBAR -->
  <div class="backdrop hidden" id="drawerBackdrop"></div>
  <aside class="drawer hidden" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <span class="drawer-title serif">Codeply</span>
    </div>
    <label class="drawer-search">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg>
      <input id="searchInput" type="search" placeholder="Search" autocomplete="off">
    </label>
    <button class="drawer-item" id="drawerNewChat">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/><path d="M17.5 3.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>
      <span>New chat</span>
    </button>
    <button class="drawer-item" id="drawerCode">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4"/></svg>
      <span>Code</span>
    </button>
    <button class="drawer-item" id="drawerCalls">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>
      <span>Calls</span>
    </button>
    <div class="drawer-label">Recents</div>
    <div class="chat-list" id="chatList"></div>
    <div class="account">
      <span class="avatar" id="accountInitial">C</span>
      <span class="account-email" id="accountEmail">Your account</span>
      <button class="icon-btn small" id="themeBtn" aria-label="Theme"></button>
      <button class="icon-btn small" id="signOutBtn" aria-label="Sign out" title="Sign out">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 16l-4-4 4-4M6 12h10"/></svg>
      </button>
    </div>
  </aside>

  <!-- BOTTOM SHEETS -->
  <section class="sheet hidden" id="offlineSheet" role="dialog" aria-modal="true" aria-labelledby="offlineTitle">
    <div class="sheet-bg" data-close></div>
    <div class="sheet-card">
      <div class="sheet-handle"></div>
      <h2 class="sheet-title" id="offlineTitle">Your PC is offline</h2>
      <p class="sheet-text">Run this in the cloud instead?</p>
      <div class="sheet-actions">
        <button class="btn btn-quiet" id="offlineNo" type="button">Not now</button>
        <button class="btn btn-primary" id="offlineYes" type="button">Use cloud</button>
      </div>
    </div>
  </section>

  <section class="sheet hidden" id="pickSheet" role="dialog" aria-modal="true">
    <div class="sheet-bg" data-close></div>
    <div class="sheet-card">
      <div class="sheet-handle"></div>
      <div id="pickBody"></div>
    </div>
  </section>

  <section class="sheet hidden" id="approvalSheet" role="dialog" aria-modal="true">
    <div class="sheet-bg"></div>
    <div class="sheet-card">
      <div class="sheet-handle"></div>
      <h2 class="sheet-title" id="approvalTitle">Codeply needs your OK</h2>
      <p class="sheet-text" id="approvalDetail"></p>
      <div class="sheet-actions">
        <button class="btn btn-quiet" id="rejectBtn" type="button">Reject</button>
        <button class="btn btn-primary" id="approveBtn" type="button">Approve once</button>
      </div>
    </div>
  </section>

  <section class="sheet hidden" id="imageSheet" role="dialog" aria-modal="true">
    <div class="sheet-bg"></div>
    <div class="sheet-card">
      <div class="sheet-handle"></div>
      <h2 class="sheet-title">Add an image?</h2>
      <p class="sheet-text" id="imageDetail"></p>
      <img class="image-pick" id="imagePickImg" alt="">
      <div class="sheet-actions">
        <button class="btn btn-quiet" id="imageNo" type="button">No image</button>
        <button class="btn btn-primary" id="imageYes" type="button">Use this one</button>
      </div>
    </div>
  </section>

  <!-- CLOUD ENVIRONMENT SETUP -->
  <section class="panel hidden" id="setup" role="dialog" aria-modal="true" aria-label="Cloud environment">
    <header class="top">
      <button class="icon-btn" id="setupBack" aria-label="Close">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="top-title">Cloud environment</div>
      <span class="icon-btn" aria-hidden="true"></span>
    </header>
    <div class="panel-body" id="setupBody"></div>
  </section>

  <!-- CALLS (phone-calls.js) -->
  <section class="panel hidden" id="calls" role="dialog" aria-modal="true" aria-label="Calls">
    <header class="top">
      <button class="icon-btn" id="callsBack" aria-label="Close">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="top-title">Calls</div>
      <span class="icon-btn" aria-hidden="true"></span>
    </header>
    <div class="panel-body" id="callsBody"></div>
  </section>

  <section class="call hidden" id="call" role="dialog" aria-modal="true" aria-label="Voice call"></section>

  <div class="lightbox hidden" id="lightbox"><img alt="Screenshot"></div>

  <script src="supabase.js"></script>
  <script src="nacl-fast.min.js"></script>
  <script src="blake2b.js"></script>
  <script src="bot-avatar.js"></script>
  <script src="phone.js"></script>
  <script src="phone-calls.js"></script>
</body>
</html>
