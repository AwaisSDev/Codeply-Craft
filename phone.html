<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0d0d0d" id="themeColorMeta">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- Opaque, not black-translucent: on iOS 26 a see-through status bar leaves the home-screen app
       sized short by the status bar's height, with a dead band at the bottom (WebKit bug 301108). -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Codeply</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="phone-favicon.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="stylesheet" href="phone.css">
  <link rel="stylesheet" href="phone-calls.css">
  <link rel="stylesheet" href="phone-design.css">
  <script>
    // Apply a stored dark/light choice before first paint.
    (function () {
      try {
        var t = localStorage.getItem('craft-theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!-- SIGN IN -->
  <section class="signin hidden" id="signin">
    <div class="signin-inner">
      <img class="signin-mark" src="logo.png" alt="">
      <h1>Sign in to Codeply</h1>
      <p class="muted">Use the same account as Codeply on your computer.</p>

      <form class="signin-form" id="loginForm">
        <input id="loginEmail" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="Email" required>
        <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Password" required>
        <button class="btn btn-primary" type="submit" id="loginBtn">Sign in</button>
        <p class="form-error hidden" id="loginError"></p>
        <button class="link-btn" id="useCodeBtn" type="button">No password? Email me a sign-in code</button>
      </form>

      <form class="signin-form hidden" id="otpForm">
        <p class="muted" id="otpSentTo">We emailed you a sign-in code.</p>
        <input id="loginOtp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="12" placeholder="Code from the email" required>
        <button class="btn btn-primary" type="submit">Sign in</button>
        <p class="form-error hidden" id="otpError"></p>
        <button class="link-btn" id="otpBackBtn" type="button">Back to password sign-in</button>
      </form>

      <div class="signin-busy hidden" id="signinBusy"><span class="spinner"></span><span id="signinBusyText">Signing in...</span></div>
    </div>
  </section>

  <!-- APP -->
  <section class="app hidden" id="app">
    <header class="top">
      <button class="circle-btn" id="menuBtn" aria-label="Open sidebar">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M4.5 9h15M4.5 15h9"/></svg>
      </button>
      <button type="button" class="top-title" id="titleBtn" aria-haspopup="menu" aria-label="Choose model">
        <span id="topTitle">Haze 2</span>
        <svg class="caret" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10l5 5 5-5"/></svg>
      </button>
      <div class="top-right">
      <button class="circle-btn hidden" id="chatMoreBtn" aria-label="Chat options" aria-haspopup="menu">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
      </button>
      <button class="circle-btn" id="newChatTopBtn" aria-label="New chat">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4H6.5A2.5 2.5 0 0 0 4 6.5v11A2.5 2.5 0 0 0 6.5 20h11a2.5 2.5 0 0 0 2.5-2.5V12"/><path d="M17.6 3.6a2 2 0 0 1 2.8 2.8L12.5 14.3l-3.7.9.9-3.7Z"/></svg>
      </button>
      </div>
    </header>

    <main class="scroll" id="scroll">
      <div class="empty" id="empty">
        <div class="empty-head">
          <h1 class="greeting" id="greeting">What can I help with?</h1>
          <p class="empty-sub" id="emptySub"></p>
        </div>
      </div>
      <div class="feed hidden" id="feed" aria-live="polite"></div>
    </main>

    <form class="composer empty-input" id="composer">
      <div class="slash hidden" id="slashMenu" role="listbox" aria-label="Commands"></div>
      <div class="suggest" id="suggest"></div>
      <div class="box">
        <div class="att-row hidden" id="attRow"></div>
        <div class="ctx-row hidden" id="ctxRow">
          <span class="ctx-chip" id="projectChip">
            <button type="button" class="ctx-main" id="projectChipBtn" aria-haspopup="menu">
              <span class="ctx-ico" id="projectChipIco"></span>
              <span id="projectChipName">Project</span>
              <i class="ctx-dot" id="pcDot"></i>
            </button>
            <button type="button" class="ctx-x" id="projectChipX" aria-label="Remove project"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
          </span>
          <span class="ctx-chip hidden" id="codeModeChip">
            <button type="button" class="ctx-main" id="codeModeBtn" aria-haspopup="menu"><span id="codeModeName">Plan</span></button>
            <button type="button" class="ctx-x" id="codeModeX" aria-label="Back to Build"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
          </span>
        </div>
        <span class="ctx-status hidden" id="pcStatus"><i></i><span>PC offline</span></span>
        <input type="file" id="attInput" multiple hidden>
        <textarea id="input" rows="1" placeholder="Ask anything"></textarea>
        <div class="box-row">
          <button type="button" class="round-btn" id="plusBtn" aria-label="Add" aria-haspopup="menu">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <span class="spacer"></span>
          <button type="button" class="voice-btn" id="voiceBtn" aria-label="Voice call">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></svg>
          </button>
          <button type="submit" class="send-btn" id="sendBtn" aria-label="Send">
            <svg id="sendIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
            <svg id="stopIcon" class="hidden" viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2.5"/></svg>
          </button>
        </div>
      </div>
    </form>
  </section>

  <!-- SIDEBAR -->
  <div class="backdrop hidden" id="drawerBackdrop"></div>
  <aside class="drawer hidden" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <span class="drawer-title" id="drawerTitle">Codeply</span>
      <label class="drawer-search hidden" id="drawerSearch">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg>
        <input id="searchInput" type="search" placeholder="Search chats" autocomplete="off">
      </label>
      <button class="circle-btn" id="searchToggle" aria-label="Search chats">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg>
      </button>
    </div>
    <nav class="drawer-nav" id="drawerNav">
      <button class="drawer-item" id="drawerProjects"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7.5a2 2 0 0 1 2-2h3.6l2 2h7.4a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2Z"/><path d="M3.5 10.5h17"/></svg><span>Projects</span></button>
      <button class="drawer-item" id="drawerCloud"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18.5a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 9a4 4 0 0 1 .5 7.97V18.5Z"/></svg><span>Cloud</span></button>
      <button class="drawer-item" id="drawerCalls"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 4h3.2l1.8 4.5-2.2 1.4a11 11 0 0 0 5.8 5.8l1.4-2.2 4.5 1.8v3.2a1.5 1.5 0 0 1-1.6 1.5A16.5 16.5 0 0 1 4 5.6 1.5 1.5 0 0 1 5.5 4Z"/></svg><span>Calls</span></button>
      <button class="drawer-item" id="drawerDesign"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2a8.8 8.8 0 1 0 0 17.6c1.2 0 2-.9 2-2 0-.6-.3-1.1-.6-1.5-.3-.3-.5-.8-.5-1.2 0-1.1.9-2 2-2h2.4c2.4 0 4.4-2 4.4-4.4C21.7 6.6 17.3 3.2 12 3.2z"/><circle cx="7.6" cy="11" r="1.2" fill="currentColor" stroke="none"/><circle cx="11.4" cy="7.4" r="1.2" fill="currentColor" stroke="none"/><circle cx="16" cy="8.4" r="1.2" fill="currentColor" stroke="none"/></svg><span>Design</span></button>
    </nav>
    <div class="drawer-sep" id="drawerSep"></div>
    <div class="chat-list" id="chatList"></div>
    <div class="drawer-foot">
      <button class="pill-new" id="drawerNewChat">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4H6.5A2.5 2.5 0 0 0 4 6.5v11A2.5 2.5 0 0 0 6.5 20h11a2.5 2.5 0 0 0 2.5-2.5V12"/><path d="M17.6 3.6a2 2 0 0 1 2.8 2.8L12.5 14.3l-3.7.9.9-3.7Z"/></svg>
        <span>Chat</span>
      </button>
      <button class="circle-btn" id="settingsBtn" aria-label="Settings" aria-haspopup="menu">
        <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      </button>
      <!-- kept for older code paths: account details live in the settings menu -->
      <span class="hidden"><span id="accountInitial"></span><span id="accountEmail"></span><button id="themeBtn"></button><button id="signOutBtn"></button></span>
    </div>
  </aside>

  <!-- BOTTOM SHEETS -->
  <section class="sheet hidden" id="offlineSheet" role="dialog" aria-modal="true" aria-labelledby="offlineTitle">
    <div class="sheet-bg" data-close></div>
    <div class="sheet-card">
      <div class="sheet-handle"></div>
      <h2 class="sheet-title" id="offlineTitle">Your PC is offline</h2>
      <p class="sheet-text">Run this in the cloud instead?</p>
      <div class="sheet-actions">
        <button class="btn btn-quiet" id="offlineNo" type="button">Not now</button>
        <button class="btn btn-primary" id="offlineYes" type="button">Use cloud</button>
      </div>
    </div>
  </section>

  <!-- DROPDOWN MENUS (anchored to the button that opened them, like Craft on the PC) -->
  <div class="pop-layer hidden" id="popLayer">
    <div class="pop-catch" data-pop-close></div>
    <div class="pop" id="pop" role="menu"></div>
  </div>

  <section class="sheet hidden" id="pickSheet" role="dialog" aria-modal="true">
    <div class="sheet-bg" data-close></div>
    <div class="sheet-card">
      <div class="sheet-handle"></div>
      <div id="pickBody"></div>
    </div>
  </section>

  <section class="sheet hidden" id="approvalSheet" role="dialog" aria-modal="true">
    <div class="sheet-bg"></div>
    <div class="sheet-card">
      <div class="sheet-handle"></div>
      <h2 class="sheet-title" id="approvalTitle">Codeply needs your OK</h2>
      <p class="sheet-text" id="approvalDetail"></p>
      <div class="sheet-actions">
        <button class="btn btn-quiet" id="rejectBtn" type="button">Reject</button>
        <button class="btn btn-primary" id="approveBtn" type="button">Approve once</button>
      </div>
    </div>
  </section>

  <section class="sheet hidden" id="imageSheet" role="dialog" aria-modal="true">
    <div class="sheet-bg"></div>
    <div class="sheet-card">
      <div class="sheet-handle"></div>
      <h2 class="sheet-title">Add an image?</h2>
      <p class="sheet-text" id="imageDetail"></p>
      <img class="image-pick" id="imagePickImg" alt="">
      <div class="sheet-actions">
        <button class="btn btn-quiet" id="imageNo" type="button">No image</button>
        <button class="btn btn-primary" id="imageYes" type="button">Use this one</button>
      </div>
    </div>
  </section>

  <!-- CLOUD ENVIRONMENT SETUP -->
  <section class="panel hidden" id="setup" role="dialog" aria-modal="true" aria-label="Cloud environment">
    <header class="top">
      <button class="icon-btn" id="setupBack" aria-label="Close">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="top-title">Cloud environment</div>
      <span class="icon-btn" aria-hidden="true"></span>
    </header>
    <div class="panel-body" id="setupBody"></div>
  </section>

  <!-- CALLS (phone-calls.js) -->
  <section class="panel hidden" id="calls" role="dialog" aria-modal="true" aria-label="Calls">
    <header class="top">
      <button class="icon-btn" id="callsBack" aria-label="Close">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="top-title">Calls</div>
      <span class="icon-btn" aria-hidden="true"></span>
    </header>
    <div class="panel-body" id="callsBody"></div>
  </section>

  <section class="panel hidden" id="design" role="dialog" aria-modal="true" aria-label="Design">
    <header class="top">
      <button class="icon-btn" id="designBack" aria-label="Back">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="top-title"><span id="designTitle">Design</span></div>
      <span class="icon-btn" aria-hidden="true"></span>
    </header>
    <div class="panel-body dg-body" id="designBody"></div>
    <form class="composer dg-composer" id="designComposer">
      <div class="dg-kinds" id="designKinds" role="group" aria-label="Kind of design"></div>
      <div class="box">
        <textarea id="designInput" rows="1" placeholder="What should we design?"></textarea>
        <div class="box-row">
          <span class="dg-note" id="designNote"></span>
          <button type="submit" class="send-btn" aria-label="Design it">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></svg>
          </button>
        </div>
      </div>
    </form>
  </section>

  <section class="call hidden" id="call" role="dialog" aria-modal="true" aria-label="Voice call"></section>

  <div class="lightbox hidden" id="lightbox"><img alt="Screenshot"></div>

  <script src="supabase.js"></script>
  <script src="nacl-fast.min.js"></script>
  <script src="blake2b.js"></script>
  <script src="bot-avatar.js"></script>
  <script src="attachments.js"></script>
  <script src="phone.js"></script>
  <script src="phone-reminders.js"></script>
  <script src="phone-life.js"></script>
  <script src="phone-calls.js"></script>
  <script src="phone-design.js"></script>
</body>
</html>
