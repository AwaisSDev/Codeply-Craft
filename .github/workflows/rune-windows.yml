name: Codeply 4.0 on Rune (Windows)

# Builds the Rune desktop app (rune-app/) for Windows on a Windows runner, with the MSVC toolchain
# Rust's Windows builds expect, and publishes it to one fixed pre-release so there is always a
# download link to the newest build. Nothing to install on your PC: download, unzip, run.

on:
  workflow_dispatch:
  push:
    branches: [rune-v4, rune-v5]
    paths:
      - 'rune-app/**'
      - 'codeply-cli/**'
      - 'craft-dsh/**'
      - 'scripts/package-dsh.mjs'
      - '.github/workflows/rune-windows.yml'

permissions:
  contents: write

concurrency:
  group: rune-windows-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml in rune-app pins the toolchain Rune builds with; rustup installs it.
      - name: Toolchain
        working-directory: rune-app
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rune-app/target
          key: rune-windows-${{ hashFiles('rune-app/Cargo.lock', 'rune-app/rust-toolchain.toml') }}
          restore-keys: rune-windows-

      - name: Build
        working-directory: rune-app
        run: cargo build --release --features live

      - name: Test
        working-directory: rune-app
        run: cargo test --release

      # The engine ships inside the zip, so Codeply.exe needs nothing else installed:
      # DSH and the Node 24 that runs it (scripts/package-dsh.mjs, as the Electron build does),
      # and codeply-cli with its production dependencies.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build the engine (DSH and codeply-cli)
        run: |
          npm install -g pnpm@11.28.5
          (cd craft-dsh && pnpm install --frozen-lockfile && pnpm run build)
          node scripts/package-dsh.mjs
          (cd codeply-cli && npm ci --omit=dev --no-audit --no-fund)

      - name: Package
        run: |
          mkdir -p dist/Codeply-Rune/resources
          cp rune-app/target/release/codeply.exe dist/Codeply-Rune/Codeply.exe
          cp -r dsh-runtime dist/Codeply-Rune/resources/dsh-runtime
          mkdir -p dist/Codeply-Rune/resources/codeply-cli
          cp -r codeply-cli/bin codeply-cli/lib codeply-cli/skills codeply-cli/agents codeply-cli/node_modules codeply-cli/package.json dist/Codeply-Rune/resources/codeply-cli/
          du -sh dist/Codeply-Rune/resources/*
          cp rune-app/licenses/* dist/Codeply-Rune/
          cp rune-app/TRY-IT.txt dist/Codeply-Rune/
          cd dist && 7z a -tzip Codeply-Rune-windows-x64.zip Codeply-Rune >/dev/null
          ls -la

      # The installer: the same folder as the zip, as Codeply-Setup.exe (installer/codeply.iss).
      - name: Installer
        shell: pwsh
        run: |
          $ver = (Select-String -Path rune-app/Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $num = ($ver -split '-')[0]
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $icon = Get-ChildItem rune-app/target/release/build -Recurse -Filter codeply.ico -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $isccArgs = @("/DAppVersion=$num", "/DSourceDir=$PWD\dist\Codeply-Rune", "/DOutputDir=$PWD\dist")
          if ($icon) { $isccArgs += "/DIconFile=$($icon.FullName)" }
          & $iscc @isccArgs rune-app\installer\codeply.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem dist -File | Select-Object Name, Length | Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: Codeply-Rune-windows-x64
          path: dist/Codeply-Rune-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Codeply-Setup
          path: dist/Codeply-Setup.exe

      # rune-v4 keeps its old link (rune-windows-latest); every other branch gets its own,
      # rune-v5 -> rune-v5-windows-latest.
      - name: Publish to the branch's latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${GITHUB_REF_NAME}" = "rune-v4" ]; then TAG=rune-windows-latest; else TAG="${GITHUB_REF_NAME}-windows-latest"; fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --target "${GITHUB_SHA}" --title "Codeply 4.0 beta on Rune, Windows (${GITHUB_REF_NAME})" --notes "Test build of the native Rune app from the ${GITHUB_REF_NAME} branch. Run Codeply-Setup.exe to install it, or unzip Codeply-Rune-windows-x64.zip and run Codeply.exe. See TRY-IT.txt inside."
          gh release upload "$TAG" dist/Codeply-Rune-windows-x64.zip dist/Codeply-Setup.exe --clobber
