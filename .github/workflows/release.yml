name: Build & Release

on:
  push:
    tags:
      - 'v*'

# GitHub's modern default gives the auto-generated GITHUB_TOKEN read-only
# access, which is what "Resource not accessible by integration" means when
# a job tries to create a release - this grants write explicitly regardless
# of the repo/org default.
permissions:
  contents: write

# electron-builder's own `--publish always` is what correctly generates AND
# uploads latest.yml/latest-mac.yml - the metadata electron-updater reads to
# detect new versions - so both jobs use it rather than a separate
# build-then-upload step.
#
# build-mac runs AFTER build-windows (`needs:`), not in parallel: two
# `--publish always` calls for the same tag running at once can both decide
# "no release exists yet" before either has created one, and each creates its
# own SEPARATE release. Sequenced, the second job finds the first job's
# release and adds its assets to it instead.
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Engine tests
        run: npm run test:engine

      # Bakes the Connect Apps OAuth credentials into the build (see
      # scripts/embed-secrets.js). Add these as repository secrets.
      - name: Embed OAuth app credentials
        env:
          VERCEL_CLIENT_ID: ${{ secrets.VERCEL_CLIENT_ID }}
          VERCEL_CLIENT_SECRET: ${{ secrets.VERCEL_CLIENT_SECRET }}
          VERCEL_SLUG: ${{ secrets.VERCEL_SLUG }}
          SUPABASE_CLIENT_ID: ${{ secrets.SUPABASE_CLIENT_ID }}
          SUPABASE_CLIENT_SECRET: ${{ secrets.SUPABASE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
          SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
        run: npm run embed-secrets

      - name: Build & publish Windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

  build-mac:
    needs: build-windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Embed OAuth app credentials
        env:
          VERCEL_CLIENT_ID: ${{ secrets.VERCEL_CLIENT_ID }}
          VERCEL_CLIENT_SECRET: ${{ secrets.VERCEL_CLIENT_SECRET }}
          VERCEL_SLUG: ${{ secrets.VERCEL_SLUG }}
          SUPABASE_CLIENT_ID: ${{ secrets.SUPABASE_CLIENT_ID }}
          SUPABASE_CLIENT_SECRET: ${{ secrets.SUPABASE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
          SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
        run: npm run embed-secrets

      - name: Build & publish Mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --publish always
