name: Build & Release

on:
  push:
    tags:
      - 'v*'

# GitHub's modern default gives the auto-generated GITHUB_TOKEN read-only
# access, which is what "Resource not accessible by integration" means when
# a job tries to create a release - this grants write explicitly regardless
# of the repo/org default.
permissions:
  contents: write

# electron-builder's own `--publish always` generates AND uploads the installers
# plus latest.yml/latest-mac.yml (what auto-update reads).
#
# The draft release is created up front by create-release. Without it,
# electron-builder's parallel uploads each found "no release yet" and created
# their own, splitting one version across duplicate drafts. With it, both
# builds upload into the same draft (in parallel), and publish makes it public
# only after every build succeeded, so /releases/latest/download/... never
# points at a half-finished release.
jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1             || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --title "Codeply Craft ${TAG#v}" --notes "Codeply Craft ${TAG#v}"

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Engine tests
        run: npm run test:engine

      # Bakes the Connect Apps OAuth credentials into the build (see
      # scripts/embed-secrets.js). Add these as repository secrets.
      - name: Embed OAuth app credentials
        env:
          VERCEL_CLIENT_ID: ${{ secrets.VERCEL_CLIENT_ID }}
          VERCEL_CLIENT_SECRET: ${{ secrets.VERCEL_CLIENT_SECRET }}
          VERCEL_SLUG: ${{ secrets.VERCEL_SLUG }}
          SUPABASE_CLIENT_ID: ${{ secrets.SUPABASE_CLIENT_ID }}
          SUPABASE_CLIENT_SECRET: ${{ secrets.SUPABASE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
          SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
        run: npm run embed-secrets

      - name: Build & publish Windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

  build-mac:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Embed OAuth app credentials
        env:
          VERCEL_CLIENT_ID: ${{ secrets.VERCEL_CLIENT_ID }}
          VERCEL_CLIENT_SECRET: ${{ secrets.VERCEL_CLIENT_SECRET }}
          VERCEL_SLUG: ${{ secrets.VERCEL_SLUG }}
          SUPABASE_CLIENT_ID: ${{ secrets.SUPABASE_CLIENT_ID }}
          SUPABASE_CLIENT_SECRET: ${{ secrets.SUPABASE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
          SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
        run: npm run embed-secrets

      - name: Build & publish Mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --publish always

  publish:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest
