<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Codeply</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="drop.css">
</head>
<body>
<!-- Empty, the drop is just the message bar. Once a chat starts it grows upward
     into a panel: a slim header, the conversation, the same bar at the bottom. -->
<div class="card" id="card">
  <header class="head" id="head">
    <span class="title" id="title">New chat</span>
    <div class="head-actions">
      <button class="icon" id="newBtn" type="button" title="New chat" aria-label="New chat">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 2.8a1.4 1.4 0 0 1 0 2L7.5 10.5 5 11l.5-2.5 5.7-5.7a1.4 1.4 0 0 1 2 0zM8 3H3.5C2.7 3 2 3.7 2 4.5v8c0 .8.7 1.5 1.5 1.5h8c.8 0 1.5-.7 1.5-1.5V8"/></svg>
      </button>
      <button class="icon" id="craftBtn" type="button" title="Open in Codeply" aria-label="Open in Codeply">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 3H3.5C2.7 3 2 3.7 2 4.5v8c0 .8.7 1.5 1.5 1.5h8c.8 0 1.5-.7 1.5-1.5v-3M9.5 2H14v4.5M14 2 7.5 8.5"/></svg>
      </button>
      <button class="icon" id="hideBtn" type="button" title="Hide (Esc)" aria-label="Hide">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
      </button>
    </div>
  </header>

  <main class="thread" id="thread">
    <div class="feed" id="feed"></div>
  </main>

  <!-- Under the top bar only, while no chat is open: "Past chats" and the last three. -->
  <div class="hist3" id="hist3"></div>

  <footer class="composer" id="composer">
    <button class="close" id="closeBtn" type="button" title="Hide (Esc)" aria-label="Hide">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
    </button>
    <!-- Under the top bar only: the files going with the next message, a folder
         button for the project and a + for files. -->
    <div class="files" id="files" hidden></div>
    <i class="brk" aria-hidden="true"></i>
    <button class="tool proj" id="folderBtn" type="button" title="Project folder" aria-label="Project folder">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5A2 2 0 0 1 5.5 5.5h3.6l2 2.2h7.4a2 2 0 0 1 2 2v7.8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>
      <svg class="pc" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 5.5h15a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zM2.5 19.5h19"/></svg>
      <span id="folderName">Pick a folder</span>
    </button>
    <textarea id="input" rows="1" placeholder="Ask Codeply anything" spellcheck="true"></textarea>
    <button class="tool round" id="attachBtn" type="button" data-menu title="Add files or a folder" aria-label="Add files or a folder">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5v11M6.5 12h11"/></svg>
    </button>
    <div class="row">
      <button class="pill" id="projBtn" type="button" data-menu title="Project">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5c0-.8.7-1.5 1.5-1.5h2.6l1.4 1.5h5c.8 0 1.5.7 1.5 1.5v5.5c0 .8-.7 1.5-1.5 1.5h-9c-.8 0-1.5-.7-1.5-1.5z"/></svg>
        <span id="projName">Project</span>
      </button>
      <button class="pill" id="modeBtn" type="button" data-menu title="Mode and permissions">
        <span id="modeName">Build</span>
        <span class="full-tag" id="fullTag" hidden>Full access</span>
      </button>
      <span class="grab" aria-hidden="true"></span>
      <button class="icon" id="recentBtn" type="button" data-menu title="Recent chats" aria-label="Recent chats">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8a5.5 5.5 0 1 0 1.6-3.9M2.5 2.5v2.2h2.2M8 5v3.2l2 1.3"/></svg>
      </button>
      <button class="model" id="modelBtn" type="button" data-menu title="Model">
        <span id="modelName">Haze 2</span>
        <svg class="caret" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.5 8 10l3.5-3.5"/></svg>
      </button>
      <button class="send" id="sendBtn" type="button" aria-label="Send">
        <svg class="i-send" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3.5M3.8 7.5 8 3.3l4.2 4.2"/></svg>
        <svg class="i-stop" viewBox="0 0 16 16" aria-hidden="true"><rect x="4.5" y="4.5" width="7" height="7" rx="1.5"/></svg>
      </button>
    </div>
  </footer>
</div>
<div class="menu" id="menu" hidden></div>
<script src="../crew/markdown.js"></script>
<script src="../new-project-name.js"></script>
<script src="drop.js"></script>
</body>
</html>
