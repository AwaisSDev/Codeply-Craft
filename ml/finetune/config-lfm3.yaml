# Codeply context model v1 on LFM3-1.7B (the best off-the-shelf model on test-mini;
# docs/local-intelligence/MODEL-SELECTION.md). Same data and schedule as config.yaml.
#   python ml/finetune/train_lora.py --config ml/finetune/config-lfm3.yaml
base_model: LiquidAI/LFM3-1.7B
# The architecture is code in the model repo (Liquid's own fine-tuning notebook loads it this way).
trust_remote_code: true
# Must match the runtime (CATALOG['lfm3-1.7b-*'].extra in local-runtime.js): thinking off.
chat_template_kwargs:
  enable_thinking: false

train_file: ml/data/out/sft-train.jsonl
val_file: ml/data/out/sft-val.jsonl
output_dir: ml/finetune/runs/codeply-context-v1-lfm3
max_seq_len: 2048
seed: 7

epochs: 2
batch_size: 8
grad_accum: 2          # effective batch 16
learning_rate: 2.0e-4
weight_decay: 0.0
warmup_ratio: 0.03
gradient_checkpointing: true
log_every: 10
eval_every: 200

# LFM3 layer names (Liquid's SFT notebook): attention q/k/v/o, the short-conv
# blocks' in_proj/out_proj, and the MLP w1/w2/w3. Not the per-head gate_proj.
lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, in_proj, out_proj, w1, w2, w3]

smoke:
  base_model: HuggingFaceTB/SmolLM2-135M-Instruct
  trust_remote_code: false
  chat_template_kwargs: {}
  output_dir: /tmp/codeply-ft-smoke
  train_limit: 16
  val_limit: 4
  batch_size: 2
  grad_accum: 1
  max_steps: 2
  epochs: 1
  eval_every: 0
  gradient_checkpointing: false
  lora:
    r: 8
    alpha: 16
    dropout: 0.0
    target_modules: [q_proj, v_proj]
